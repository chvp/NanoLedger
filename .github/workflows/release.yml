name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Parse tag
      id: parse_tag
      run: "echo ${{ github.ref }} | sed 's#^refs/tags/#version=#' >> $GITHUB_OUTPUT"
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v4.0.1
    - name: Build release APK
      run: |
        ./gradlew assembleRelease
        $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-unsigned-aligned.apk
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
        echo "${{ secrets.KEYSTORE_PASSWORD }}" | $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks keystore.jks --out nanoledger-${{ steps.parse_tag.outputs.version }}.apk app/build/outputs/apk/release/app-release-unsigned-aligned.apk
        $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify nanoledger-${{ steps.parse_tag.outputs.version }}.apk
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "nanoledger-${{ steps.parse_tag.outputs.version }}.apk"
        artifactErrorsFailBuild: true
        artifactContentType: application/vnd.android.package-archive
        generateReleaseNotes: true
        immutableCreate: true
        prerelease: ${{ contains(steps.parse_tag.outputs.version, 'beta') }}
        makeLatest: ${{ !contains(steps.parse_tag.outputs.version, 'beta') }}
        name: ${{ steps.parse_tag.outputs.version }}
        tag: ${{ steps.parse_tag.outputs.version }}
