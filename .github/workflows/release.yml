name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v4.0.1
    - name: Build release APK
      run: |
        ./gradlew assembleRelease
        $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-unsigned-aligned.apk
        echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
        echo "${{ secrets.KEYSTORE_PASSWORD }}" | $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks keystore.jks --out "nanoledger-$GITHUB_REF_NAME.apk" app/build/outputs/apk/release/app-release-unsigned-aligned.apk
        $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify "nanoledger-$GITHUB_REF_NAME.apk"
    - name: Create release
      run: |
        if [[ "$GITHUB_REF_NAME" == *beta* ]]
        then
          gh release create "$GITHUB_REF_NAME" "nanoledger-$GITHUB_REF_NAME.apk" --generate-notes --verify-tag --prerelease --latest=false
        else
          gh release create "$GITHUB_REF_NAME" "nanoledger-$GITHUB_REF_NAME.apk" --generate-notes --verify-tag
        fi
      env:
        GH_TOKEN: ${{ github.token }}
